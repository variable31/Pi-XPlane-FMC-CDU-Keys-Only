name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DFLIGHTSIM_WERROR=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  deb:
    needs: test
    runs-on: ubuntu-latest
    # Bookworm's glibc (2.36) is the oldest Raspberry Pi OS we support;
    # building here keeps the binary runnable on Bookworm and Trixie.
    container: debian:bookworm
    strategy:
      matrix:
        arch: [armhf, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          VERSION=""
          case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF#refs/tags/v}" ;; esac
          scripts/build-deb.sh ${{ matrix.arch }} "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: flight-simulator-keys-${{ matrix.arch }}
          path: build-${{ matrix.arch }}/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
