name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # A release published from the GitHub web UI creates its tag server-side;
  # this trigger makes sure that path builds and attaches the packages too.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DFLIGHTSIM_WERROR=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  deb:
    needs: test
    runs-on: ubuntu-latest
    # Bookworm's glibc (2.36) is the oldest Raspberry Pi OS we support;
    # building here keeps the binary runnable on Bookworm and Trixie.
    container: debian:bookworm
    strategy:
      matrix:
        arch: [armhf, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          VERSION=""
          case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF#refs/tags/v}" ;; esac
          scripts/build-deb.sh ${{ matrix.arch }} "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: flight-simulator-keys-${{ matrix.arch }}
          path: build-${{ matrix.arch }}/*.deb
          if-no-files-found: error

  display-deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build flight-simulator-display .deb
        run: |
          VERSION=""
          case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF#refs/tags/v}" ;; esac
          scripts/build-display-deb.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: flight-simulator-display
          path: build-display/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, display-deb]
    runs-on: ubuntu-latest
    # Tag push and release events can both fire for one version; run them
    # one at a time so the second just re-uploads the same files.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Also publish version-less copies so the README's
          # releases/latest/download/... links never change.
          for f in dist/*.deb; do
            cp "$f" "dist/$(basename "$f" | sed -E 's/_[0-9][0-9.]*_/_/')"
          done
          ls dist
          # Create the release, or add to it if it was already made in the
          # web UI (or by the other trigger for this tag).
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
