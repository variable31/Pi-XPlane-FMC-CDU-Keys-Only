; flight-simulator-keys configuration
;
; Maps a GPIO key matrix to X-Plane commands. Edit, then:
;   sudo systemctl restart flight-simulator-keys
; Comments start with ';' or '#'.

[gpio]
; GPIO character device. /dev/gpiochip0 is the 40-pin header on Pi 3/4/5.
chip = /dev/gpiochip0

; BCM GPIO numbers (not physical pin numbers). Order defines the
; row/col numbers used in [keys] below: first entry = 1.
; Default wiring matches the original Pi-XPlane-FMC-CDU PCB:
;   col:  1   2   3   4   5   6   7  8  9
columns = 14  15  18  23  24  25  8  7  16
;   row:  1   2  3  4  5   6   7   8
rows    = 21  2  3  4  17  27  22  10

; A key must read the same for this long before it counts (press and release).
debounce_ms = 20

[xplane]
; Leave host empty to find X-Plane automatically via its network beacon.
; Set it (IP or hostname) if the beacon does not reach the Pi, e.g. when
; Wi-Fi blocks multicast.
host =
; X-Plane's UDP receive port; only used when host is set.
port = 49000

[keys]
; row,col = X-Plane command
; Default: X-Plane's built-in FMS (sim/FMS/*), 69 keys, same as the
; original Pi-XPlane-FMC-CDU-Keys-Only. Find more commands in X-Plane
; under Settings > Keyboard, or in Resources/plugins/Commands.txt.
1,1   = sim/FMS/ls_1l  ; sw-1
2,1   = sim/FMS/ls_2l  ; sw-2
3,1   = sim/FMS/ls_3l  ; sw-3
4,1   = sim/FMS/ls_4l  ; sw-4
5,1   = sim/FMS/ls_5l  ; sw-5
6,1   = sim/FMS/ls_6l  ; sw-6
7,1   = sim/FMS/ls_1r  ; sw-7
8,1   = sim/FMS/ls_2r  ; sw-8
