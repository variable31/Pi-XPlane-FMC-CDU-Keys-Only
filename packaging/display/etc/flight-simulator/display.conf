; flight-simulator-display configuration
;
; Shows the X-Plane CDU full screen on the Pi's display, using the WebFMC
; plugin running inside X-Plane on the simulator PC. Edit, then:
;   sudo systemctl restart flight-simulator-display
; Comments start with ';' or '#'.

[webfmc]
; X-Plane PC address. Leave empty to use the address flight-simulator-keys
; finds automatically (the same one the buttons use).
host =
; WebFMC's web server port (WebFMC default: 9090).
port = 9090
; Page to open on the WebFMC server.
path = /
; Show only the CDU screen, without WebFMC's on-screen keys (the panel has
; real buttons). Set to no to show WebFMC's keys as well.
screen_only = yes
; Which CDU to show: 0 = captain (left), 1 = first officer (right).
side = 0
; More WebFMC options, comma separated, e.g. brt=90,night=1
extra =

[display]
; Seconds WebFMC may be unreachable before switching to the
; "Waiting for X-Plane" screen.
lost_seconds = 30
; Extra Chromium flags, e.g. --force-device-scale-factor=1.5 to enlarge.
chromium_flags =
